<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>생활비와 빚</title>
<style>
:root{ color-scheme:light; --bg:#faf9f7; --fg:#1f1e1c; --muted:#6f6b64; --line:#e6e2db; --panel:#fff; --bad:#b23b2e }
@media (prefers-color-scheme:dark){ :root{ color-scheme:dark; --bg:#191817; --fg:#ecebe8; --muted:#9d9890; --line:#34322f; --panel:#232221; --bad:#e0776a } }
html,body{ margin:0; height:100% }
body{ background:var(--bg); color:var(--fg); display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
form{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:17rem }
h1{ margin:0 0 4px; font-size:1.1rem; font-weight:600 }
input,button{ font:inherit; padding:11px 13px; border-radius:9px; border:1px solid var(--line); width:100% }
input{ background:var(--panel); color:var(--fg) }
button{ background:var(--fg); color:var(--bg); border-color:var(--fg); cursor:pointer }
button:disabled{ opacity:.5; cursor:default }
p{ margin:0; font-size:.8rem; color:var(--muted); min-height:1.2em }
label{ display:flex; align-items:center; gap:7px; font-size:.82rem; color:var(--muted); cursor:pointer }
label input{ width:auto; margin:0 }
p.bad{ color:var(--bad) }
</style>
</head>
<body>
<form id="gate">
  <h1>생활비와 빚</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" autofocus>
  <label><input id="keep" type="checkbox"> 이 기기에서 계속 기억</label>
  <button id="go" type="submit">열기</button>
  <p id="msg"></p>
</form>

const ITER = 210000;
const SLOT = 'pg.pw';
const form = document.getElementById('gate'), pw = document.getElementById('pw'),
      keep = document.getElementById('keep'), go = document.getElementById('go'),
      msg = document.getElementById('msg');
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

const read = () => { try { return sessionStorage.getItem(SLOT) || localStorage.getItem(SLOT); } catch (e) { return null; } };
const write = (v, forever) => { try { sessionStorage.setItem(SLOT, v); if (forever) localStorage.setItem(SLOT, v); } catch (e) {} };
const wipe = () => { try { sessionStorage.removeItem(SLOT); localStorage.removeItem(SLOT); } catch (e) {} };

async function open_(word) {
  const raw = b64(BLOB), salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(word), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!window.isSecureContext || !crypto.subtle) {
    msg.className = 'bad'; msg.textContent = 'https 주소로 열어야 합니다.'; return;
  }
  go.disabled = true; msg.className = ''; msg.textContent = '여는 중…';
  try {
    const word = pw.value;
    await open_(word);
    write(word, keep.checked);          // 새로고침해도 안 풀리게
  } catch (err) {
    go.disabled = false; msg.className = 'bad'; msg.textContent = '비밀번호가 맞지 않습니다.';
    pw.select();
  }
});

(async () => {                          // 전에 연 적이 있으면 바로 연다
  const word = read();
